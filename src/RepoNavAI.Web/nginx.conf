# No URI, query, headers, client address or request body in API access logs.
log_format repository_api '$request_method $status $request_time $upstream_status $upstream_http_x_reponav_run_id';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        access_log /dev/stdout repository_api;
        # Nginx error messages can include the raw request (including a search query).
        # Use the safe access status and API run summary to investigate upstream failures.
        error_log /dev/null;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /health { proxy_pass http://${API_UPSTREAM}; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}
