server { listen 8080; server_name _; root /usr/share/nginx/html; index index.html; location /api/ { proxy_pass http://${API_UPSTREAM}; proxy_http_version 1.1; proxy_buffering off; proxy_request_buffering off; proxy_cache off; proxy_read_timeout 180s; proxy_set_header Connection ""; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } location /health { proxy_pass http://${API_UPSTREAM}; } location = /index.html { add_header Cache-Control "no-store"; } location / { try_files $uri $uri/ /index.html; } }
