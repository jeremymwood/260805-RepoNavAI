services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reponav}
      POSTGRES_USER: ${POSTGRES_USER:-reponav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: src/RepoNavAI.Api/Dockerfile }
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-reponav};Username=${POSTGRES_USER:-reponav};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: RepoNavAI
      Jwt__Audience: RepoNavAI.Web
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Admin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Cors__AllowedOrigins__0: http://localhost:5173
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: { context: ., dockerfile: src/RepoNavAI.Web/Dockerfile }
    restart: unless-stopped
    ports: ["5173:8080"]
    depends_on: { api: { condition: service_healthy } }
volumes: { postgres-data: {} }
