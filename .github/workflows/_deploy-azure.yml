name: Deploy Azure environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      publish-run-id:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.application-url }}
    concurrency:
      group: azure-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-manifest-*
          path: release
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.publish-run-id }}
      - uses: azure/login@858f4093d287a904987dfd22abd163280f939550 # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        name: Migrate, deploy, smoke test, and promote
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_WORKER_APP: ${{ vars.AZURE_WORKER_APP }}
          AZURE_MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB }}
          APPLICATION_URL: ${{ vars.APPLICATION_URL }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy-azure.sh release/release-manifest.json
      - name: Write deployment summary
        if: always()
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Azure deployment"
            echo "- Environment: ${ENVIRONMENT_NAME}"
            echo "- Result: ${DEPLOYMENT_RESULT}"
            echo "- Publish run: ${{ inputs.publish-run-id }}"
            test ! -f release/deployment-record.json || echo '- Deployment record attached'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deployment-${{ inputs.environment }}-${{ github.run_id }}
          path: release/deployment-record.json
          if-no-files-found: warn
          retention-days: 90
