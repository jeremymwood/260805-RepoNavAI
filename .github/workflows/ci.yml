name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile Bicep templates
        run: >-
          docker run --rm
          --volume "$PWD:/src"
          --workdir /src
          mcr.microsoft.com/azure-cli:2.76.0
          az bicep build --file infra/bicep/main.bicep --stdout
          > /dev/null
      - name: Scan infrastructure configuration
        run: >-
          docker run --rm
          --volume "$PWD:/src"
          --workdir /src
          bridgecrew/checkov:3.2.495
          --directory infra/bicep
          --framework bicep
          --skip-check CKV_AZURE_109,CKV_AZURE_139,CKV_AZURE_166,CKV_AZURE_189
          --compact
          --quiet
      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          rhysd/actionlint:1.7.7
      - name: Validate deployment shell scripts
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          koalaman/shellcheck:v0.10.0
          scripts/deploy-azure.sh
          scripts/rollback-azure.sh
          scripts/test-deployment-scripts.sh
      - name: Test deployment and rollback orchestration
        run: bash scripts/test-deployment-scripts.sh

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: node scripts/validate-docs.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 9.0.x }
      - run: dotnet restore RepoNavAI.sln
      - run: dotnet build RepoNavAI.sln --configuration Release --no-restore
      - run: dotnet test RepoNavAI.sln --configuration Release --no-build
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: src/RepoNavAI.Web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: src/RepoNavAI.Web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/RepoNavAI.Api/Dockerfile
          - name: web
            dockerfile: src/RepoNavAI.Web/Dockerfile
          - name: worker
            dockerfile: src/RepoNavAI.Worker/Dockerfile
          - name: migrator
            dockerfile: src/RepoNavAI.Migrator/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
