name: Bug
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including safe error details?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Local Docker, Local native, CI, Hosted environment]
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and diagnostics
      description: Include severity, logs with secrets removed, and any workaround.
    validations:
      required: true
